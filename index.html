<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>2027학년도 대구 대입 수시면접 대비 · 마이더스K 교육컨설팅</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --ink:#0b0b0d;
    --ink-2:#1a1b1f;
    --ink-3:#3d3f47;
    --muted:#6b6e78;
    --line:#e7e6e1;
    --line-2:#efeeea;
    --paper:#fbfaf6;
    --paper-2:#f3f1ea;
    --card:#ffffff;
    --brand:#1F45A8;       /* midas K blue */
    --brand-2:#2A5BD9;
    --brand-soft:#eaf0ff;
    --accent:#e8c14b;      /* warm gold accent */
    --highlight:#fff4a8;   /* highlight */
    --good:#127a4f;
    --warn:#b54708;
    --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:28px;
    --shadow-1: 0 1px 0 rgba(15,17,21,.04), 0 1px 2px rgba(15,17,21,.04);
    --shadow-2: 0 1px 0 rgba(15,17,21,.04), 0 10px 30px -12px rgba(15,17,21,.18);
    --shadow-3: 0 24px 60px -28px rgba(31,69,168,.45), 0 8px 20px -12px rgba(15,17,21,.18);
    --gap: 28px;
    --content: 760px;     /* naver-blog-like single-column width */
  }
  html[data-density="compact"]   { --gap: 18px; }
  html[data-density="comfortable"]{ --gap: 28px; }
  html[data-density="roomy"]     { --gap: 44px; }

  html[data-serif="true"] body { font-family: "Noto Serif KR","Source Serif Pro",ui-serif,Georgia,serif; }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
  body{
    font-family:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "system-ui", Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-feature-settings:"ss06","ss07","cv11";
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    line-height:1.7;
    font-size:17px;
    letter-spacing:-.005em;
  }
  img{max-width:100%;display:block}
  a{color:inherit}
  ::selection{background:var(--brand);color:#fff}

  /* ============ Page chrome ============ */
  .page{max-width:var(--content);margin:0 auto;padding:0 22px 120px}

  /* Top bar — like a blog post breadcrumb, not Naver chrome */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 22px;max-width:1200px;margin:0 auto;
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
  .topbar .brand img{width:32px;height:32px;object-fit:contain}
  .topbar .brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1}
  .topbar .brand .nm{font-size:14px;line-height:1.2}
  .topbar .meta{display:flex;gap:14px;color:var(--muted);font-size:12.5px}
  .topbar .meta span+span{padding-left:14px;border-left:1px solid var(--line)}

  /* ============ Hero ============ */
  .hero{
    position:relative;overflow:hidden;
    border-radius:var(--r-xl);
    background:#0b0b0d;
    color:#fff;
    padding:38px 36px 0;
    margin-top:8px;
    box-shadow:var(--shadow-2);
  }
  .hero .aurora{position:absolute;inset:-20%;pointer-events:none;filter:blur(60px);opacity:.9;z-index:0;transition:opacity .6s ease}
  html[data-gradient="none"] .hero .aurora{opacity:0}
  html[data-gradient="warm"] .hero .aurora .b1{background:radial-gradient(closest-side,#f6c97a,transparent)}
  html[data-gradient="warm"] .hero .aurora .b2{background:radial-gradient(closest-side,#f49f6a,transparent)}
  html[data-gradient="warm"] .hero .aurora .b3{background:radial-gradient(closest-side,#caa6ff,transparent)}
  .hero .aurora .b{position:absolute;width:60%;height:60%;border-radius:50%;animation:drift 22s ease-in-out infinite}
  .hero .aurora .b1{left:-10%;top:-20%;background:radial-gradient(closest-side,#3b6bff,transparent)}
  .hero .aurora .b2{right:-15%;top:-10%;background:radial-gradient(closest-side,#7a5cff,transparent);animation-delay:-7s}
  .hero .aurora .b3{left:20%;bottom:-30%;background:radial-gradient(closest-side,#4ad6ff,transparent);animation-delay:-13s}
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(4%,-3%) scale(1.07)}
  }
  .hero-inner{position:relative;z-index:1}
  .hero .kicker{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18);
    font-size:12px;letter-spacing:.02em;color:#cfe0ff;
    backdrop-filter:blur(8px);
  }
  .hero .kicker .dot{width:6px;height:6px;border-radius:50%;background:#7cc4ff;box-shadow:0 0 0 4px rgba(124,196,255,.18)}
  .hero h1{
    font-size:46px;line-height:1.12;letter-spacing:-.025em;
    margin:18px 0 14px;font-weight:800;
    text-wrap:balance;
  }
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,#9cc1ff,#fff,#f8d76b);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .lede{font-size:17px;color:#d8dae3;max-width:540px;margin:0 0 26px;line-height:1.65}
  .hero .lede b{color:#fff;font-weight:600}

  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:end}
  .hero-photo{
    position:relative;margin-top:30px;
    border-radius:18px 18px 0 0;overflow:hidden;
    aspect-ratio: 4/3;
    background:#222;
    box-shadow: inset 0 -120px 80px -60px rgba(11,11,13,.7);
  }
  .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:contrast(1.02) saturate(1.04)}
  .hero-photo .caption{position:absolute;left:14px;bottom:12px;font-size:11.5px;letter-spacing:.04em;color:rgba(255,255,255,.78);font-weight:500}

  /* hero credentials + call CTA */
  .hero-creds{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:8px;color:#cdd2dd;font-size:14.5px}
  .hero-creds li{position:relative;padding-left:14px}
  .hero-creds li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:#7cc4ff;opacity:.7}
  .hero-creds b{color:#fff;font-weight:600}
  .hero-call{
    display:flex;flex-direction:column;gap:2px;
    margin-top:6px;padding:18px 22px;border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
    backdrop-filter:blur(8px);
  }
  .hero-call .hc-lab{font-size:11.5px;letter-spacing:.18em;color:#9cc1ff;font-weight:700;text-transform:uppercase}
  .hero-call .hc-num{font-size:38px;font-weight:800;letter-spacing:-.015em;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px;font-family:"Pretendard Variable",ui-sans-serif,sans-serif}
  .hero-call .hc-num .hc-d{color:rgba(255,255,255,.45);margin:0 1px;font-weight:700}
  .hero-call .hc-cta{font-size:12px;color:#cdd2dd;margin-top:6px;letter-spacing:-.005em}

  .stats{
    margin:34px -36px 0;
    padding:18px 36px;
    border-top:1px solid rgba(255,255,255,.08);
    display:grid;grid-template-columns:repeat(4,1fr);gap:0;
    background:rgba(255,255,255,.02);
  }
  .stat{padding:6px 0}
  .stat .n{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff}
  .stat .n .u{font-size:14px;color:#9aa1b3;font-weight:600;margin-left:2px}
  .stat .l{font-size:12px;color:#9aa1b3;margin-top:2px}

  /* ============ Section ============ */
  section{margin-top:64px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--brand);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  }
  .eyebrow .ln{width:22px;height:1.5px;background:var(--brand)}
  h2{font-size:30px;line-height:1.2;letter-spacing:-.022em;font-weight:800;margin:8px 0 8px;text-wrap:balance}
  h2 em{font-style:normal;color:var(--brand);font-weight:800}
  h2 mark{background:linear-gradient(transparent 58%, var(--highlight) 58%);color:var(--ink);padding:0 2px;}
  .sub{color:var(--ink-3);font-size:15.5px;max-width:600px;margin:0;line-height:1.7}

  /* ============ Differentiator cards ============ */
  .diff{
    display:grid;grid-template-columns:1fr;gap:14px;margin-top:24px;
    counter-reset: diff;
  }
  .diff .card{
    counter-increment: diff;
    position:relative;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:22px 24px 22px 86px;
    transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s;
    will-change:transform;
  }
  .diff .card::before{
    content: "0" counter(diff);
    position:absolute;left:24px;top:22px;
    font-size:26px;font-weight:800;letter-spacing:-.02em;
    color:var(--brand);font-variant-numeric:tabular-nums;
  }
  .diff .card::after{
    content:"";position:absolute;left:24px;top:60px;width:42px;height:2px;background:var(--ink);opacity:.85;transition:width .35s ease, background .35s;
  }
  .diff .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:#dcdad3}
  .diff .card:hover::after{width:60px;background:var(--brand)}
  .diff .card h3{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .diff .card p{margin:0;color:var(--ink-3);font-size:14.5px;line-height:1.65}

  /* ============ Quote / media bar ============ */
  .mediabar{
    margin-top:28px;
    background:var(--ink);color:#fff;border-radius:var(--r-lg);
    padding:22px 26px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
    box-shadow:var(--shadow-2);
  }
  .mediabar h4{margin:0;font-size:14px;color:#cdd2dd;font-weight:600;letter-spacing:.02em}
  .mediabar ul{list-style:none;margin:0;padding:0;display:flex;gap:10px;flex-wrap:wrap}
  .mediabar li{font-size:12.5px;padding:6px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:#e8ecf3}
  .mediabar li b{color:#fff;font-weight:600}

  /* ============ Program / pricing ============ */
  .price-tabs{display:inline-flex;background:#f0eee8;border-radius:999px;padding:4px;gap:2px;margin-top:18px}
  .price-tabs button{
    appearance:none;border:0;background:transparent;
    padding:9px 18px;border-radius:999px;font:inherit;font-weight:600;
    color:var(--ink-3);cursor:pointer;font-size:13.5px;letter-spacing:-.005em;
    transition:all .25s;
  }
  .price-tabs button.on{background:var(--ink);color:#fff;box-shadow:0 4px 14px -4px rgba(0,0,0,.3)}
  .price-tabs button:not(.on):hover{color:var(--ink)}

  .price-card{
    margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    overflow:hidden;box-shadow:var(--shadow-1);
  }
  .price-head{
    padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;
    background:linear-gradient(180deg, #fbfaf6 0%, #fff 100%);
    border-bottom:1px solid var(--line-2);
  }
  .price-head .name{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .price-head .title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .price-head .desc{font-size:13.5px;color:var(--ink-3);margin-top:8px;max-width:380px}
  .price-head .num{text-align:right}
  .price-head .num .big{font-size:38px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1}
  .price-head .num .big .u{font-size:16px;font-weight:700;margin-left:2px}
  .price-head .num .small{font-size:12.5px;color:var(--ink-3);margin-top:6px}
  .price-body{padding:22px 28px}
  .price-body ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
  .price-body ol li{font-size:14px;color:var(--ink-2);padding-left:22px;position:relative;line-height:1.55}
  .price-body ol li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:50%;background:var(--brand-soft);border:2px solid var(--brand)}
  .price-foot{padding:14px 28px;border-top:1px dashed var(--line);background:var(--paper-2);font-size:13px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .price-foot b{color:var(--ink)}
  .price-foot .pill{font-size:11.5px;padding:3px 8px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);font-weight:600;letter-spacing:.02em}

  /* university chips */
  .univ-block{margin-top:28px}
  .univ-block h4{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-size:14.5px;font-weight:700}
  .univ-block h4 .tag{font-size:11px;padding:3px 8px;background:var(--ink);color:#fff;border-radius:999px;font-weight:600;letter-spacing:.04em}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:13px;padding:6px 11px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);
    transition:all .25s;cursor:default;font-weight:500;
  }
  .chip:hover{background:var(--brand);border-color:var(--brand);color:#fff;transform:translateY(-1px)}
  .chip.muted{color:var(--muted);background:transparent}

  /* ============ Timeline ============ */
  .timeline{position:relative;margin-top:28px;padding-left:18px}
  .timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--brand),var(--ink) 80%)}
  .timeline .step{position:relative;padding:0 0 22px 26px}
  .timeline .step::before{
    content:"";position:absolute;left:-18px;top:6px;width:14px;height:14px;border-radius:50%;
    background:#fff;border:3px solid var(--brand);box-shadow:0 0 0 4px rgba(31,69,168,.08);
    transition:all .3s;
  }
  .timeline .step:hover::before{background:var(--brand);transform:scale(1.15)}
  .timeline .step .lab{font-size:11.5px;color:var(--brand);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .timeline .step .ttl{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:2px 0 4px}
  .timeline .step .desc{font-size:14px;color:var(--ink-3);line-height:1.6}

  /* ============ Contact grid ============ */
  .contact{
    display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px;
  }
  .contact .c{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:20px 22px;transition:all .3s;position:relative;overflow:hidden;
    text-decoration:none;color:inherit;display:block;
  }
  .contact .c .cta{margin-top:10px;font-size:12.5px;color:var(--brand);font-weight:600;letter-spacing:-.005em}
  .contact .c::before{display:none}
  .contact .c:hover{
    border-color:var(--brand);
    transform:translateY(-2px);
    box-shadow:0 18px 40px -22px rgba(31,69,168,.35), 0 4px 10px -4px rgba(15,17,21,.08);
    background:#fafbff;
  }
  .contact .c:hover .lab{color:var(--brand)}
  .contact .c:hover .v{color:var(--ink)}
  .contact .c .lab{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);transition:color .25s}
  .contact .c .v{font-size:22px;font-weight:800;letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin:6px 0 4px;color:var(--ink);transition:color .25s}
  .contact .c .d{font-size:13px;color:var(--ink-3);line-height:1.5}

  /* ============ Notice list ============ */
  .notice{margin-top:24px;background:#fffaf2;border:1px solid #f3e4c4;border-radius:var(--r-lg);padding:20px 24px}
  .notice h4{margin:0 0 10px;font-size:14px;font-weight:700;color:#8a5a00;display:flex;align-items:center;gap:8px}
  .notice ol{margin:0;padding-left:18px;color:#5b3f0e;font-size:14px;line-height:1.7}
  .notice ol li{padding:2px 0}
  .notice ol li b{color:#7a4f00}

  /* ============ Floating CTA ============ */
  .float-cta{
    position:fixed;right:24px;bottom:24px;z-index:50;
    display:flex;flex-direction:column;gap:10px;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
  }
  .float-cta a{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;border-radius:999px;
    background:var(--ink);color:#fff;text-decoration:none;
    font-size:13.5px;font-weight:600;letter-spacing:-.005em;
    box-shadow:var(--shadow-3);
    border:1px solid rgba(255,255,255,.06);
    transition:transform .25s, background .25s;
  }
  .float-cta a:hover{transform:translateY(-2px);background:var(--brand)}
  .float-cta a .ic{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:12px}

  /* ============ Footer card ============ */
  .footer{margin-top:80px;text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.01em}
  .footer .logo{display:inline-flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;letter-spacing:-.01em;font-size:14px;margin-bottom:8px}
  .footer .logo img{width:24px;height:24px;object-fit:contain}

  /* ============ Scroll reveal ============ */
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  /* ============ Section divider art ============ */
  .divider{margin:60px 0 0;display:flex;align-items:center;gap:18px;color:var(--muted)}
  .divider .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
  .divider .ic{font-size:18px;color:var(--brand);letter-spacing:.06em;font-weight:700}

  @media (max-width:780px){
    body{font-size:16px}
    .hero{padding:28px 24px 0}
    .hero h1{font-size:34px}
    .hero-grid{grid-template-columns:1fr;gap:18px}
    .stats{grid-template-columns:repeat(2,1fr);margin:24px -24px 0;padding:14px 24px}
    .stats .stat:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:14px}
    .price-head{grid-template-columns:1fr;gap:12px}
    .price-head .num{text-align:left}
    .price-body ol{grid-template-columns:1fr}
    .contact{grid-template-columns:1fr}
    .float-cta a span:not(.ic){display:none}
    .float-cta a{padding:12px}
  }
</style>
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <div class="brand">
    <img src="logo.png" alt="MIDAS K" />
    <div>
      <div class="nm">마이더스K 교육컨설팅</div>
      <small>MIDAS K · Education Consulting</small>
    </div>
  </div>
  <div class="meta">
    <span>2026.05.18</span>
    <span>대입 · 수시</span>
    <span id="rt">읽는 시간 8분</span>
  </div>
</header>

<main class="page" id="root"></main>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
